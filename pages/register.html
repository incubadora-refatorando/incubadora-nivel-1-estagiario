<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce</title>
</head>

<body>
  <main class="register-container">
    <section class="register-card">
      <h1 class="register-tittle">Crie sua Conta</h1>
      <form class="form-container">
        <div class="form-group">
          <label for="name" class="form-label">Digite seu Nome:</label>
          <input type="text" id="name" class="input-control" required placeholder="Seu Nome">
        </div>
        <div class="form-group">
          <label for="email" class="form-label">Digite seu E-mail:</label>
          <input type="text" id="email" class="input-control" required placeholder="seuemail123@exe.com">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Digite sua Senha:</label>
          <input type="password" id="password" class="input-control" required placeholder="suasenha1234">
        </div>
        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirme sua Senha:</label>
          <input type="password" id="confirm-password" class="input-control" required placeholder="suasenha1234">
        </div>
        <div class="form-group">
          <label for="phone" class="form-label">Telefone (opcional)</label>
          <input type="tel" id="phone" name="phone" placeholder="(11) 99999-9999">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="terms" class="checkbox-input" required>
          <label for="terms" class="terms-text">Li e Aceito <a href="#">Termos de Uso</a></label>
        </div>
        <button type="submit" class="primary-btn">Cadastrar</button>
      </form>
    </section>
  </main>
</body>

</html>
