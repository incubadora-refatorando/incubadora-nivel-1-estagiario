<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login E-commerce</title>
</head>

<body>
  <main>
    <h2 class="login-container">Acessar Conta</h2>
    <form class="login-form">
      <div class="div-group">
        <label for="email">Digite seu E-mail:</label>
        <input type="email" id="email" required placeholder="seuemail@exemplo.com">
      </div>
      <div class="div-group">
        <label for="password">Digite sua Senha:</label>
        <input type="password" username="password" id="password" placeholder="suasenha123" required>
      </div>
      <button type="submit" class="bnt-login">Entrar</button>
      <p class="footer-login">
        Não tem conta? <a href="#">Cadastre-se</a>
        <a href="#">Esqueci minha senha</a>
    </form>
  </main>

</body>

</html>
