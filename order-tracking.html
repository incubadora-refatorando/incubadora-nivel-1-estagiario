<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Rastreamento</title>
    </head>
    <body>
        <header>
          <h1>Rastreamento</h1>
        </header>

        <main>

            <section>
                <form action="" method="post">

                  <label for="Rastreamento">Rastrear pedido:</label>
                  <input type="text" placeholder="BR1234567890" id="Rastreamento">
                  <button>Rastrear</button>

                </form>
            </section>

            <section style="display: none;">
               <h3> Resultado da busca:</h3>

               <div class="Resultado">
                 <p>Pedido encontrado!</p>
                 <p>Status: Em transporte <br>Código: BR123456 <br> Previsão de entrega: 28/05/2026</p>
               </div>
            </section>

        <footer>
        <a href="#"> Entre em contato com o nosso suporte</a>
        </footer>
    </body>
</html>
